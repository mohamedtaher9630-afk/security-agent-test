# Function to dynamically translate UI strings using Gemini if a non-default language is chosen
@st.cache_data(show_spinner=False)
def get_translated_texts(target_language, api_key_for_trans):
    if target_language == "English":
        return BASE_TEXTS
    
    if not api_key_for_trans:
        return BASE_TEXTS

    try:
        genai.configure(api_key=api_key_for_trans)
        model = genai.GenerativeModel(model_name='gemini-3.6-flash', generation_config={"response_mime_type": "application/json"})
        prompt = f"""
        Translate the following JSON dictionary values into the language: '{target_language}'. Keep the JSON keys exactly the same, only translate the string values. Do not change emojis if present.
        
        {json.dumps(BASE_TEXTS, ensure_ascii=False)}
        """
        response = model.generate_content(prompt)
        return json.loads(response.text)
    except Exception:
        return BASE_TEXTS

