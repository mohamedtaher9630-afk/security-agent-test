# Tabs for input sources
tab1, tab2, tab3, tab4, tab5, tab6 = st.tabs([t["tab1"], t["tab2"], t["tab3"], t["tab4"], t["tab5"], t["tab6"]])

file_content = ""
input_source_name = ""

with tab1:
    uploaded_file = st.file_uploader("Upload script, code, config (.env), or dependencies (requirements.txt / package.json)")
    if uploaded_file is not None:
        input_source_name = f"File/SCA: {uploaded_file.name}"
        try:
            file_content = uploaded_file.getvalue().decode("utf-8", errors="ignore")
        except Exception:
            file_content = str(uploaded_file.getvalue())

with tab2:
    can_use_zip = st.session_state.selected_plan in ["Small Business", "Enterprise Corp"] or license_key_input.strip().startswith("ENT-")
    if not can_use_zip:
        st.warning("📦 ZIP Batch Scanning is available starting from the **Small Business Plan ($29/mo)**. Please upgrade your subscription to unlock project archives.")
    else:
        uploaded_zip = st.file_uploader("Upload complete project ZIP archive for batch scanning", type="zip")
        if uploaded_zip is not None:
            input_source_name = f"ZIP Archive: {uploaded_zip.name}"
            try:
                extracted_texts = []
                with zipfile.ZipFile(io.BytesIO(uploaded_zip.getvalue())) as z:
                    for filename in z.namelist():
                        if not filename.endswith('/'):
                            with z.open(filename) as f:
                                try:
                                    content = f.read().decode('utf-8', errors='ignore')
                                    extracted_texts.append(f"--- FILE: {filename} ---\n{content}\n")
                                except Exception:
                                    pass
                file_content = "\n".join(extracted_texts)
                st.success("✅ Successfully extracted contents from ZIP archive!")
            except Exception as e:
                st.error(f"Error reading ZIP file: {e}")

with tab3:
    code_input = st.text_area("Paste code / configuration directly:", height=200)
    if code_input.strip() != "":
        input_source_name = "Direct Code Snippet"
        file_content = code_input

with tab4:
    url_input = st.text_input("Enter direct download link / URL to analyze:")
    if url_input.strip() != "":
        input_source_name = f"URL: {url_input}"
        try:
            with st.spinner("🌐 Fetching remote content securely..."):
                req = urllib.request.Request(url_input, headers={'User-Agent': 'Mozilla/5.0'})
                with urllib.request.urlopen(req, timeout=10) as response:
                    file_content = response.read(50000).decode("utf-8", errors="ignore")
                st.success("✅ Remote URL content fetched successfully!")
        except Exception as e:
            st.error(f"Error fetching URL: {e}")

with tab5:
    github_input = st.text_input("Enter GitHub repository raw file URL:")
    if github_input.strip() != "":
        input_source_name = f"GitHub Repo: {github_input}"
        try:
            with st.spinner("🐙 Fetching GitHub file content..."):
                raw_url = github_input.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/")
                req = urllib.request.Request(raw_url, headers={'User-Agent': 'Mozilla/5.0'})
                with urllib.request.urlopen(req, timeout=10) as response:
                    file_content = response.read(60000).decode("utf-8", errors="ignore")
                st.success("✅ GitHub file loaded successfully!")
        except Exception as e:
            st.error(f"Error fetching GitHub file: {e}")

with tab6:
    st.subheader(t["admin_title"])
    display_alias = st.session_state.user.split('@')[0].capitalize()
    st.markdown(f"Active User: **{display_alias}** | Plan: **{st.session_state.selected_plan}**")
    col_a1, col_a2 = st.columns(2)
    col_a1.metric("Total Processed Scans", st.session_state.total_scans)
    col_a2.metric("Total Quarantined Threats", st.session_state.threats_detected)
    
    if st.session_state.audit_history:
        st.markdown(f"### {t['audit_history']}")
        for h in st.session_state.audit_history:
            st.write(f"- **Time:** {h['time']} | **Target:** {h['type']} | **Result:** {h['status']}")
    else:
        st.info("No audit logs available for analysis yet.")

if st.button(t["run_audit"], type="primary"):
    gemini_key = api_key_input or os.getenv("GEMINI_API_KEY")
    if not gemini_key:
        st.error("Please provide your Gemini API Key in the Security Settings expander!")
    else:
        genai.configure(api_key=gemini_key)
        if not file_content.strip():
            st.warning("Please provide a file, ZIP archive, code snippet, URL, or GitHub link to scan.")
        else:
            with st.spinner(t["scan_spinner"]):
                try:
                    file_hash = hashlib.sha256(file_content.encode('utf-8', errors='ignore')).hexdigest()
                    
                    generation_config = {"response_mime_type": "application/json", "temperature": 0.1}
                    model = genai.GenerativeModel(model_name='gemini-3.6-flash', generation_config=generation_config)
                    
                    prompt = f"""
                    You are an elite cybersecurity expert, SCA auditor, and DevSecOps automated system.
                    Analyze the following content (Hash: {file_hash}) and respond in language: {st.session_state.language}:
                    1. Detect malware, ransomware, backdoors, or malicious scripts.
                    2. Check software composition (SCA): identify outdated libraries, vulnerable versions (CVEs) in requirements.txt or package.json.
                    3. Detect hardcoded secrets, database passwords, or API keys.
                    4. Fix syntax errors and generate clean, secure production code.
                    
                    Content:
                    ```
                    {file_content}
                    ```

                    Respond strictly in JSON with these keys:
                    - "vulnerable_or_malicious": boolean
                    - "threat_analysis": string (Detailed Markdown explanation of vulnerabilities, CVEs, or malware found)
                    - "sanitized_code": string (Clean, secure code or updated project files ready for deployment)
                    - "git_patch_simulation": string (A unified git diff / patch block representing the structural fixes applied)
                    """
                    
                    response = model.generate_content(prompt)
                    result = json.loads(response.text)
                    
                    st.session_state.total_scans += 1
                    if not has_unlimited_access:
                        st.session_state.user_scans += 1
                        
                    is_threat = result.get("vulnerable_or_malicious", False)
                    if is_threat:
                        st.session_state.threats_detected += 1
                        
                    threat_analysis = result.get("threat_analysis", "")
                    sanitized_code = result.get("sanitized_code", "")
                    git_patch = result.get("git_patch_simulation", "No patch adjustments required.")
                    status_str = "🚨 Quarantined & Patched" if is_threat else "✅ Clean & Secure"
                    
                    st.session_state.audit_history.append({
                        "time": datetime.now().strftime("%H:%M:%S"),
                        "type": input_source_name[:30],
                        "status": status_str
                    })
                    
                    can_use_webhook = st.session_state.selected_plan in ["Small Business", "Enterprise Corp"] or license_key_input.strip().startswith("ENT-")
                    if is_threat and webhook_url_input.strip() and can_use_webhook:
                        try:
                            webhook_data = json.dumps({"content": f"🚨 **Security Alert** [{st.session_state.user}]: Threat detected in `{input_source_name}`! Hash: `{file_hash}`"}).encode('utf-8')
                            req_wh = urllib.request.Request(webhook_url_input.strip(), data=webhook_data, headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'})
                            urllib.request.urlopen(req_wh, timeout=5)
                        except Exception:
                            pass
                    
                    st.markdown("---")
                    st.info(f"🔑 **SHA-256 Hash:** `{file_hash}`")
                    
                    if is_threat:
                        st.error(t["threat_detected"])
                        st.markdown(threat_analysis)
                    else:
                        st.success(t["success_secure"])
                        if threat_analysis:
                            st.markdown(threat_analysis)
                            
                    st.subheader(t["sanitized_output"])
                    st.code(sanitized_code)
                    
                    st.subheader(t["git_patch"])
                    st.code(git_patch, language="diff")
                    
                    col_d1, col_d2, col_d3, col_d4 = st.columns(4)
                    
                    with col_d1:
                        st.download_button(
                            label=t["dl_file"],
                            data=sanitized_code,
                            file_name="sanitized_output.txt",
                            mime="text/plain"
                        )
                    with col_d2:
                        st.download_button(
                            label=t["dl_patch"],
                            data=git_patch,
                            file_name="fix_patch.diff",
                            mime="text/plain"
                        )
                    with col_d3:
                        st.download_button(
                            label=t["dl_md"],
                            data=f"# Security Report\n**User:** {st.session_state.user}\n**Hash:** {file_hash}\n**Status:** {status_str}\n\n## Analysis\n{threat_analysis}",
                            file_name="security_report.md",
                            mime="text/markdown"
                        )
                    with col_d4:
                        can_download_pdf = st.session_state.selected_plan in ["Small Business", "Enterprise Corp"] or license_key_input.strip().startswith("ENT-")
                        if can_download_pdf:
                            buffer = io.BytesIO()
                            doc = SimpleDocTemplate(buffer, pagesize=letter)
                            styles = getSampleStyleSheet()
                            story = [
                                Paragraph("Enterprise Security Audit Report", styles['Title']),
                                Spacer(1, 10),
                                Paragraph(f"<b>User:</b> {st.session_state.user}", styles['Normal']),
                                Paragraph(f"<b>Status:</b> {status_str}", styles['Normal']),
                                Paragraph(f"<b>SHA-256 Hash:</b> {file_hash}", styles['Normal']),
                                Spacer(1, 10),
                                Paragraph("Findings & SCA Vulnerabilities:", styles['Heading2']),
                                Paragraph(threat_analysis.replace('\n', '<br/>'), styles['Normal'])
                            ]
                            doc.build(story)
                            buffer.seek(0)
                            
                            st.download_button(
                                label=t["dl_pdf"],
                                data=buffer.getvalue(),
                                file_name="security_report.pdf",
                                mime="application/pdf"
                            )
                        else:
                            st.info("🔒 PDF reports require Small Business Plan ($29/mo)")
                        
                except Exception as e:
                    st.error(f"Processing error: {e}")
